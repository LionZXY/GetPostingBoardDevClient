name: Release Android app

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Derive Android version from build number
        id: version
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          build = os.environ['BUILD_NUMBER']
          if not re.fullmatch(r'[1-9][0-9]*', build):
              raise SystemExit('Build number must be a positive integer.')
          name = f'1.1.{build}'
          # Keep upgrades compatible with the initial 1.1.0 signed APK.
          code = 1_001_000 + int(build)
          if code > 2_100_000_000:
              raise SystemExit('Build number exceeds Android versionCode limits.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'name={name}\ncode={code}\ntag=v{name}\n')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Test and lint
        run: ./gradlew :shared:desktopTest :androidApp:lintRelease

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo 'Configure the four Android signing secrets documented in docs/RELEASING.md.' >&2
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        env:
          ANDROID_SIGNING_KEYSTORE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew :androidApp:assembleRelease -PappVersionName="$VERSION_NAME" -PappVersionCode="$VERSION_CODE"

      - name: Verify and package downloads
        shell: bash
        run: |
          mkdir -p release
          cp androidApp/build/outputs/apk/release/androidApp-release.apk release/posting-board.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose release/posting-board.apk
          cd release
          sha256sum posting-board.apk > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          IS_DEFAULT_BRANCH: ${{ github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch }}
        shell: bash
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          fi

          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish,assets > "$RUNNER_TEMP/existing-release.json"; then
            # Reruns keep their build number and never replace published downloads.
            python3 - <<'PY'
          import json, os
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'existing-release.json')) as source:
              release = json.load(source)
          if release['targetCommitish'] != os.environ['GITHUB_SHA']:
              raise SystemExit('Existing release targets another commit.')
          if not release['isDraft']:
              names = {asset['name'] for asset in release['assets'] if asset['size'] > 0 and asset['state'] == 'uploaded'}
              if not {'posting-board.apk', 'SHA256SUMS.txt'} <= names:
                  raise SystemExit('Existing published release is missing its downloads.')
          PY
            if jq -e '.isDraft' "$RUNNER_TEMP/existing-release.json" > /dev/null; then
              gh release upload "$RELEASE_TAG" release/posting-board.apk release/SHA256SUMS.txt --clobber
              gh release edit "$RELEASE_TAG" --draft=false --latest=false
            fi
          else
            flags=(--latest=false)
            if [[ "$IS_DEFAULT_BRANCH" != true ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" release/posting-board.apk release/SHA256SUMS.txt \
              --target "$GITHUB_SHA" --generate-notes --title "Posting Board $VERSION_NAME" "${flags[@]}"
          fi

          if [[ "$IS_DEFAULT_BRANCH" == true ]]; then
            release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.id')
            # Let GitHub order versions so an older, slower build cannot replace a newer latest release.
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -f make_latest=legacy --silent
          fi
          gh release view "$RELEASE_TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-reports
          path: |
            shared/build/reports/tests/desktopTest
            androidApp/build/reports/lint-results-release.*
