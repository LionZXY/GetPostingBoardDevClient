name: Release Android app

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v1.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate release tag and derive Android version
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ['RELEASE_TAG']
          match = re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag)
          if not match:
              raise SystemExit('Use a stable version tag such as v1.1.0.')
          major, minor, patch = map(int, match.groups())
          code = major * 1_000_000 + minor * 1_000 + patch
          if minor > 999 or patch > 999 or not 1 <= code <= 2_100_000_000:
              raise SystemExit('Version cannot be represented as an Android versionCode.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'name={tag[1:]}\ncode={code}\n')
          PY
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Test and lint
        run: ./gradlew :shared:desktopTest :androidApp:lintRelease

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo 'Configure the four Android signing secrets documented in docs/RELEASING.md.' >&2
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        env:
          ANDROID_SIGNING_KEYSTORE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew :androidApp:assembleRelease -PappVersionName="$VERSION_NAME" -PappVersionCode="$VERSION_CODE"

      - name: Verify and package downloads
        shell: bash
        run: |
          mkdir -p release
          cp androidApp/build/outputs/apk/release/androidApp-release.apk release/posting-board.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose release/posting-board.apk
          cd release
          sha256sum posting-board.apk > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: >-
          gh release create "$RELEASE_TAG"
          release/posting-board.apk release/SHA256SUMS.txt
          --verify-tag --generate-notes
          --title "Posting Board $VERSION_NAME"

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-reports
          path: |
            shared/build/reports/tests/desktopTest
            androidApp/build/reports/lint-results-release.*
